[project]
name = "sangeet-inference"
version = "0.1.0"
description = "Python Inference Daemon for Sangeet AI"
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "Commercial EULA" }
dependencies = [
    "grpcio>=1.62.0,<1.63.0",
    "protobuf>=4.25.0,<5.0.0",
    "numpy>=1.24.0,<2.0.0",
    "soundfile>=0.12.1",
    "structlog>=24.1.0",
    "torch==2.3.0",
    "torchaudio==2.3.0",
    "deepfilternet>=0.5.0,<0.6.0",
    "pyloudnorm>=0.1.1",
]

[project.optional-dependencies]
dev = [
    "black>=24.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "grpcio-tools>=1.62.0,<1.63.0",
    "pyinstaller>=6.6.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["sangeet_inference/proto"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RET", "ARG", "PTH"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
